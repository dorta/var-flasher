<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Var Flasher</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">V</span><span>Var Flasher</span></div><span class="platform">Linux prototype</span></header>
<main class="content">
<section class="intro"><p class="eyebrow">RECOVERY IMAGES</p><h1>Choose a release. Flash it safely.</h1><p class="muted">Browse the Variscite catalog, select an SD card, and verify the image before writing.</p></section>
<section class="filters card"><label>Search<input id="search" placeholder="SOM, OS or release"></label><label>SOM<select id="som"><option value="">All SOMs</option></select></label><label>OS<select id="os"><option value="">All OSes</option></select></label><button id="refreshCatalog" class="secondary">Refresh catalog</button></section>
<section class="card"><div class="section-title"><div><h2>Available releases</h2><p id="catalogStatus" class="muted">Loading catalog...</p></div></div><div id="releases" class="release-list"></div></section>
<section class="card device-card"><div class="section-title"><div><h2>SD card</h2><p id="deviceStatus" class="muted">No device selected.</p></div><button id="refreshDevices" class="secondary">Refresh devices</button></div><div id="devices" class="device-list"></div></section>
<section class="write-panel"><div><h2 id="selectionTitle">Ready to write</h2><p id="selectionStatus" class="muted">Select a release and a removable SD card.</p></div><button id="write" class="primary" disabled>Write image</button></section>
</main><script src="./renderer.js"></script>
</body></html>
