name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate launcher syntax
        run: bash -n run.sh

      - name: Build Docker image
        run: docker build --pull --tag var-flasher:ci .
